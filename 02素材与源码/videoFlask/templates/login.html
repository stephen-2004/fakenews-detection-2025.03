<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚假新闻检测系统</title>
    <link rel="stylesheet" href="static/css/reset.css">
    <link rel="stylesheet" href="static/css/login.css">
    <!-- less scss -->
    <style>
        .login .login-button {
            cursor: pointer;
            text-align: center;
            height: 40px;
            line-height: 40px;
            background: dodgerblue;
            color: #fff;
            border-radius: 5px;
            width: 310px;
        }
    </style>
</head>
<body id="particles-js">
<div>
    <video autoplay loop muted class="bg-video">
        <source src="static/video/earth.mp4">
    </video>
</div>
<div style="margin-top: 10%;margin-left:42%;position: absolute;">
    <span style="font-size: 30px;color: white">虚假新闻检测系统</span><br><br><br>
</div>
<form method="post" action="/">

    <div class="login" id="login">
        <h3>登录</h3>
        <ul class="log-form">
            <li>
                <i class="name"></i>
                <input type="text" placeholder="请输入用户名" onfocus="this.placeholder=''" name="username"
                       onblur="this.placeholder='请输入用户名'">
                <label for="">用户名</label>
            </li>
            <li>
                <i class="password"></i>
                <input type="password" placeholder="请输入密码" onfocus="this.placeholder=''"
                       onblur="this.placeholder='请输入密码'" name="password">
                <label for="">密码</label>
            </li>
            <br>
            {% if error %}
                <span style="color:red">{{ error }}</span>
            {% endif %}
        </ul>
        <input class="login-button" type="submit" value="登录" style="border: none;"><br><br>
        还没有账号？&nbsp;&nbsp;&nbsp;<a type="button" href="/register" value="注册">注册</a>
    </div>
</form>
<div class="rotating-plane " id="shape"></div>
<script src="static/js/particles.min.js"></script>
<script src="static/js/app.js"></script>

</body>
</html>
